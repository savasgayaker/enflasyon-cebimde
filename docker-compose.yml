# Mac mini üzerinde çalışan servisler.
# Koşum:  docker compose up -d --build
# Günlük: docker compose logs -f backend
services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      # Yerel ağa açık: geliştirirken telefon doğrudan buraya bağlanabiliyor.
      # Tünel açıldıktan sonra "127.0.0.1:8000:8000" yapılıp yerel ağdan
      # tamamen kapatılabilir — Blok 11'de tekrar bakılacak.
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/saglik').status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
